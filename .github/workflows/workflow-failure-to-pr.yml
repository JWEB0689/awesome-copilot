name: Workflow Failure to Auto-PR

# Per-repo trigger: ANY workflow failure on the default branch becomes a PR.
# This expands the old scheduled-only fixer: push, dispatch, schedule and
# merge failures all count. It ignores its own runs and the PR-Agent runs
# to avoid loops, and the engine skips infra failures + duplicates.

on:
  workflow_run:
    workflows:
      - "Advanced Copilot CLI Content Sync"
      - "Agentic Maintenance"
      - "Copilot app for Beginners Content Sync"
      - "Canvas Smoke Test — Comment"
      - "Canvas Smoke Test"
      - "Check Line Endings"
      - "Check Plugin Structure"
      - "CLI for Beginners Content Sync"
      - "Check Spelling"
      - "Contributor Reputation Check Writer"
      - "Contributor Reputation Check"
      - "Contributors"
      - "Copilot Setup Steps"
      - "Copilot Workshops Content Sync"
      - "Deploy preview website to GitHub Pages"
      - "Deploy Website to GitHub Pages"
      - "Duplicate Resource Detector"
      - "External Plugin Approval Commands"
      - "External Plugin Command Router"
      - "External Plugin Intake"
      - "External Plugin PR Quality Gates Writer"
      - "External Plugin PR Quality Gates"
      - "External Plugin Quality Gates"
      - "External Plugin Re-review Command"
      - "External Plugin Re-review"
      - "Label PR Intent Writer"
      - "Label PR Intent"
      - "Learning Hub Updater"
      - "PR Commands Writer"
      - "PR Commands"
      - "PR Duplicate Check Writer"
      - "PR Duplicate Check"
      - "PR Quality Signal Review"
      - "PR Risk Scan — Comment"
      - "PR Risk Scan — Gate"
      - "Publish distribution branches"
      - "Resource Staleness Report"
      - "Review Escalation"
      - "Review Operating Metrics"
      - "Review Routing Request"
      - "Review Routing"
      - "Setup Repository Labels"
      - "Vally Lint — PR Comment"
      - "Vally Lint — PR Gate"
      - "Skill Quality Report — Nightly Scan"
      - "Submission Gate Writer"
      - "Submission Gate"
      - "Traffic Reporting"
      - "Validate Agentic Workflow Contributions"
      - "Validate Canvas Extensions"
      - "Validate Plugins and Extensions"
      - "Validate README.md"
      - "Validate Skills"
      - "Validate Submission Gate"
      - "Call Webhooks on Main Push"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      !contains(github.event.workflow_run.name, 'Auto-PR') &&
      !contains(github.event.workflow_run.name, 'Auto-Fixer') &&
      !contains(github.event.workflow_run.name, 'PR Agent')
    uses: JWEB0689/pr-agent-settings/.github/workflows/reusable_auto_pr.yml@main
    with:
      mode: failure
      model: gemini-2.5-flash
      run_id: ${{ github.event.workflow_run.id }}
      workflow_name: ${{ github.event.workflow_run.name }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      run_url: ${{ github.event.workflow_run.html_url }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
